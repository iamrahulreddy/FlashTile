[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashtile"
version = "2.0.0"
description = "Exact attention in Triton (forward and backward), checked against an fp64 reference, with a transformers integration."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muskula Rahul" }]
requires-python = ">=3.10"
# Tested on torch 2.15 + Triton 3.9 (CUDA 13.2). On Linux, torch ships the matching Triton.
dependencies = ["torch>=2.4"]
keywords = ["attention", "flash-attention", "triton", "gpu", "gqa", "transformers", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
hf = ["transformers>=5.0"]
bench = ["numpy", "matplotlib>=3.8"]
llm = [
    "transformers>=5.6",
    "compressed-tensors>=0.20",
    "flash-linear-attention>=0.6",
    "accelerate>=1.0",
    "matplotlib>=3.8",
]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/iamrahulreddy/FlashTile"
Repository = "https://github.com/iamrahulreddy/FlashTile"
Issues = "https://github.com/iamrahulreddy/FlashTile/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["flashtile*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["cuda: needs an NVIDIA GPU (run on Modal through modal_app.py)"]
