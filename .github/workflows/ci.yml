name: CI

# CPU only: the float64 oracle, the tiled PyTorch path, gradients, gradcheck and the contract
# errors (tests/test_attention.py). GPU tests (test_cuda, test_triton, test_hf) skip themselves
# without CUDA; they run on real GPUs through `modal run modal_app.py`.

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Byte-compile every Python file
        run: python -m compileall -q flashtile tests benchmark modal_app.py

      - name: Import and backend selection
        run: |
          python -c "import flashtile, torch; q = torch.randn(1, 2, 8, 4); print(flashtile.select_backend(q, q, q))"

      - name: Tests
        run: pytest -v -rA
